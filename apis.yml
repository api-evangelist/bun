aid: bun
name: Bun
description: >-
  Bun is a fast, all-in-one JavaScript and TypeScript toolkit built by Oven (oven-sh). A single
  self-contained binary bundles a Node.js-compatible runtime, a package manager (a drop-in,
  dramatically faster replacement for npm/yarn/pnpm), a native bundler and single-file executable
  compiler, and a Jest-compatible test runner. Bun is designed as an incrementally adoptable drop-in
  replacement for Node.js, emphasizing startup speed, install speed, and elegant built-in APIs. It is
  open source, distributed as a binary via an install script, Homebrew, Docker, and npm, and is
  surfaced here as a Kleiner Perkins portfolio company. Bun exposes no hosted REST API; the CLI and
  the runtime/bundler APIs are the developer surface.
